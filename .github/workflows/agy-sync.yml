name: Agy sync

# Fork only. Mirrors pingdotgg/t3code main into this repository's `main`, merges it
# into `agy`, and pushes `agy` only when the fork still checks out. See docs/agy-fork.md.
# This file lives on `agy`, which must be the repository's default branch so the
# schedule runs.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: agy-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync upstream into agy
    if: github.repository != 'pingdotgg/t3code'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UPSTREAM_URL: https://github.com/pingdotgg/t3code.git
    steps:
      # AGY_SYNC_TOKEN (optional, a PAT with repo and workflow scopes) is needed
      # when upstream changed files under .github/workflows: GITHUB_TOKEN cannot
      # push those.
      - name: Checkout agy
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: agy
          fetch-depth: 0
          token: ${{ secrets.AGY_SYNC_TOKEN || github.token }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Configure git and fetch upstream
        id: upstream
        shell: bash
        run: |
          echo "LOG_DIR=$RUNNER_TEMP/agy-logs" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/agy-logs"
          git config user.name "agy-sync[bot]"
          git config user.email "agy-sync@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags upstream main
          upstream_sha="$(git rev-parse upstream/main)"
          echo "Upstream main: $upstream_sha"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor upstream/main HEAD && \
            [[ "$(git rev-parse --verify -q origin/main || true)" == "$upstream_sha" ]]; then
            echo "agy already has upstream main; nothing to sync."
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
          fi

      # `main` only ever mirrors upstream, so a non-fast-forward push fails the run.
      - name: Fast-forward main to upstream
        if: steps.upstream.outputs.up_to_date != 'true'
        shell: bash
        run: |
          git push origin refs/remotes/upstream/main:refs/heads/main 2>&1 | tee "$LOG_DIR/01-main.log"

      - name: Merge upstream into agy
        if: steps.upstream.outputs.up_to_date != 'true'
        id: merge
        shell: bash
        run: |
          {
            before="$(git rev-parse HEAD)"
            lock_resolved=false
            if ! git merge --no-edit -m "Merge upstream/main into agy" upstream/main; then
              remaining=()
              for file in $(git diff --name-only --diff-filter=U); do
                case "$file" in
                  pnpm-lock.yaml | apps/web/src/i18n/translations/* | apps/mobile/src/i18n/translations/*)
                    echo "Taking upstream for $file"
                    if [[ "$file" == pnpm-lock.yaml ]]; then lock_resolved=true; fi
                    git checkout --theirs -- "$file" || git rm -f -- "$file"
                    git add -- "$file" 2>/dev/null || true
                    ;;
                  *) remaining+=("$file") ;;
                esac
              done
              if (( ${#remaining[@]} > 0 )); then
                echo "Unresolved merge conflicts:"
                printf '  %s\n' "${remaining[@]}"
                git merge --abort
                exit 1
              fi
              git commit --no-edit
            fi
            echo "lock_resolved=$lock_resolved" >> "$GITHUB_OUTPUT"
          } 2>&1 | tee "$LOG_DIR/02-merge.log"

      # A clean merge keeps a frozen lockfile. A lockfile taken from upstream is
      # refreshed so fork-only dependency changes, if any, are not lost.
      - name: Setup dependencies
        if: steps.upstream.outputs.up_to_date != 'true' && steps.merge.outputs.lock_resolved != 'true'
        uses: ./.github/actions/setup-ci-deps

      - name: Setup Vite+ without installing
        if: steps.upstream.outputs.up_to_date != 'true' && steps.merge.outputs.lock_resolved == 'true'
        uses: ./.github/actions/setup-ci-deps
        with:
          install: "false"

      - name: Refresh the lockfile
        if: steps.upstream.outputs.up_to_date != 'true' && steps.merge.outputs.lock_resolved == 'true'
        shell: bash
        run: vp install --no-frozen-lockfile 2>&1 | tee "$LOG_DIR/03-lockfile.log"

      - name: Regenerate i18n catalogs
        if: steps.upstream.outputs.up_to_date != 'true'
        shell: bash
        run: vp run -r i18n:generate 2>&1 | tee "$LOG_DIR/04-i18n.log"

      - name: Commit regenerated files
        if: steps.upstream.outputs.up_to_date != 'true'
        shell: bash
        run: |
          git add -A pnpm-lock.yaml apps/web/src/i18n/translations apps/mobile/src/i18n/translations
          if git diff --cached --quiet; then
            echo "Nothing regenerated."
          else
            git commit -m "chore(agy): regenerate lockfile and i18n catalogs after upstream sync"
          fi

      - name: Check fork hooks
        if: steps.upstream.outputs.up_to_date != 'true'
        shell: bash
        run: node scripts/agy/check-hooks.ts 2>&1 | tee "$LOG_DIR/05-hooks.log"

      - name: Check Swarmcode rebrand targets
        if: steps.upstream.outputs.up_to_date != 'true'
        shell: bash
        run: node scripts/agy/apply-brand.ts --check 2>&1 | tee "$LOG_DIR/06-brand.log"

      - name: Typecheck touched packages
        if: steps.upstream.outputs.up_to_date != 'true'
        shell: bash
        run: |
          packages=(@t3tools/contracts @t3tools/client-runtime t3 @t3tools/web)
          if [[ -n "$(find apps/mobile/src -iname '*agy*' -o -iname '*swarm*' 2>/dev/null | head -n 1)" ]]; then
            packages+=(@t3tools/mobile)
          fi
          # One package at a time so a failure in one still reports every other package's errors.
          failed=()
          for package in "${packages[@]}"; do
            echo "::group::typecheck $package"
            vp run --filter "$package" typecheck 2>&1 | tee -a "$LOG_DIR/07-typecheck.log" || failed+=("$package")
            echo "::endgroup::"
          done
          if (( ${#failed[@]} > 0 )); then
            # Effect's suggestions bury the errors, and the failure issue quotes only the log's tail.
            errors="$(grep -E "error TS" "$LOG_DIR/07-typecheck.log" || true)"
            printf 'Typecheck failed in: %s\n%s\n' "${failed[*]}" "$errors" | tee -a "$LOG_DIR/07-typecheck.log"
            exit 1
          fi

      - name: Run fork tests
        if: steps.upstream.outputs.up_to_date != 'true'
        shell: bash
        run: |
          # Fork tests, plus upstream's tests for every upstream file the fork edits: an upstream
          # change can break the fork's edit there without any merge conflict.
          mapfile -t tests < <(
            {
              find apps packages -path '*/node_modules' -prune -o -type f \
                \( -name '*.test.ts' -o -name '*.test.tsx' \) \
                \( -path '*/agy/*' -o -path '*/toolkits/swarm/*' -o -path '*/components/swarm/*' \
                   -o -iname '*agy*' -o -iname '*swarm*' \) -print
              git diff --name-only upstream/main HEAD -- apps packages | grep -E '\.tsx?$' |
                while read -r file; do
                  [[ -f "$file" ]] || continue
                  case "$file" in *.test.ts | *.test.tsx) echo "$file"; continue ;; esac
                  for candidate in "${file%.*}.test.ts" "${file%.*}.test.tsx" "${file%.*}.browser.test.tsx"; do
                    if [[ -f "$candidate" ]]; then echo "$candidate"; fi
                  done
                done
            } | sort -u
          )
          echo "Fork tests: ${#tests[@]}"
          printf '  %s\n' "${tests[@]}"
          if (( ${#tests[@]} == 0 )); then exit 0; fi
          vp test run --passWithNoTests "${tests[@]}" 2>&1 | tee "$LOG_DIR/08-tests.log"

      - name: Push agy
        if: steps.upstream.outputs.up_to_date != 'true'
        shell: bash
        run: |
          if [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/agy)" ]]; then
            echo "agy is already up to date."
          else
            git push origin HEAD:refs/heads/agy
          fi

      - name: Close the sync issue
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for number in $(gh issue list --label agy-sync --state open --json number --jq '.[].number'); do
            gh issue close "$number" --comment "Sync recovered in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
          done

      - name: Report failure in an issue
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.upstream_sha }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          failed="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
            --jq '[.jobs[].steps[] | select(.conclusion == "failure") | .name] | first' || true)"
          log="$(ls -1 "$LOG_DIR"/*.log 2>/dev/null | tail -n 1 || true)"
          excerpt=""
          if [[ -n "$log" ]]; then excerpt="$(tail -n 80 "$log" | tail -c 20000)"; fi
          body_file="$RUNNER_TEMP/agy-issue.md"
          fence='```'
          {
            echo "The agy sync failed, so agy was not updated."
            echo
            echo "- Failing step: ${failed:-unknown}"
            echo "- Run: $run_url"
            echo "- Upstream main: ${UPSTREAM_SHA:-unknown}"
            echo
            echo "Last log lines:"
            echo
            echo "$fence"
            echo "$excerpt"
            echo "$fence"
            echo
            echo "Resolve it locally with the steps in docs/agy-fork.md, then push agy."
          } > "$body_file"
          gh label create agy-sync --color B60205 --description "Upstream sync failures for the agy fork" 2>/dev/null || true
          existing="$(gh issue list --label agy-sync --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body-file "$body_file"
          else
            gh issue create --label agy-sync --title "agy sync failed: ${failed:-unknown}" --body-file "$body_file"
          fi
