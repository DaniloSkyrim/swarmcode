name: Agy release

# Fork only. On pushes to `agy`, after a successful "Agy sync", or by hand, builds an
# unsigned Windows NSIS installer of the desktop app and a standalone Android APK from the
# tip of `agy`, rebranded as Swarmcode (see TRADEMARK.md), and publishes them as a GitHub
# prerelease with the nightly auto-update feed (nightly.yml). See docs/agy-fork.md.

on:
  push:
    branches: [agy]
  workflow_run:
    workflows: ["Agy sync"]
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: "Build even when this agy commit already has a release"
        type: boolean
        default: false
      skip_android:
        description: "Skip building the Android APK"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: agy-release
  cancel-in-progress: false

jobs:
  check:
    name: Find agy commit
    if: github.repository != 'pingdotgg/t3code' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.agy.outputs.sha }}
      date: ${{ steps.agy.outputs.date }}
      skip: ${{ steps.agy.outputs.skip }}
    steps:
      - id: agy
        name: Resolve agy and look for an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/agy" --jq .sha)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          skip=false
          if [[ "$FORCE" != "true" ]] && gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" --jq '.[].body // ""' | grep -q "agy-commit: $sha"; then
            echo "agy $sha already has a release; nothing to build."
            skip=true
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build Windows installer
    needs: check
    if: needs.check.outputs.skip != 'true'
    # Packages the Windows target on Linux as upstream's release does. A Windows host
    # also writes a server compile cache into the payload, which breaks its file limit.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
    env:
      # The app's updater follows this repository's releases, not upstream's.
      T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
      # Builds outside pingdotgg/t3code report "dev" telemetry, as release.yml does.
      T3CODE_TELEMETRY_CHANNEL: dev
    steps:
      - name: Checkout agy
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.check.outputs.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/web... --filter=@t3tools/scripts...

      # Same public T3 Connect ids as a release preview build, read from .env.example.
      - name: Load T3 Connect public config
        run: |
          for name in CLERK_PUBLISHABLE_KEY CLERK_JWT_TEMPLATE CLERK_CLI_OAUTH_CLIENT_ID RELAY_URL; do
            value="$(sed -n "s|^T3CODE_$name=||p" .env.example)"
            if [[ -n "$value" ]]; then echo "T3CODE_$name=$value" >> "$GITHUB_ENV"; fi
          done

      # Upstream's nightly base version, a run number above upstream's (see docs/agy-fork.md),
      # so this build sorts after upstream's latest nightly.
      - id: release_meta
        name: Resolve version
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RELEASE_DATE: ${{ needs.check.outputs.date }}
        run: |
          node scripts/resolve-nightly-release.ts \
            --date "$RELEASE_DATE" \
            --run-number "$((100000 + RUN_NUMBER))" \
            --sha "$(git rev-parse HEAD)" \
            --github-output

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ steps.release_meta.outputs.version }}"

      # Published forks must not carry T3 Code's name or icons; this renames the app,
      # its copy, and its icons, and fails if upstream moved one of those spots.
      - name: Rebrand as Swarmcode
        run: node scripts/agy/apply-brand.ts

      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/resource-monitor/target/x86_64-pc-windows-msvc/release/t3-resource-monitor.exe
          key: resource-monitor-x86_64-pc-windows-msvc-${{ hashFiles('.cargo/config.toml', 'native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install cargo-xwin
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-xwin@0.23.1

      - name: Build resource monitor
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        run: cargo xwin build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Build JS bundle
        run: vp run build:desktop:bundle

      # Unsigned, and without the WSL runtime (that archive needs the Linux CLI build).
      - name: Build Windows installer
        env:
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: true
        run: |
          vp run dist:desktop:artifact \
            --platform win \
            --target nsis \
            --arch x64 \
            --build-version "${{ steps.release_meta.outputs.version }}" \
            --skip-build \
            --verbose

      - name: Check the update feed file
        run: |
          ls -la release
          [[ -f release/nightly.yml ]] || { echo "::error::release/nightly.yml missing, so installs could not auto-update."; exit 1; }
          ls release/*.exe

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release
          path: |
            release/*.exe
            release/*.blockmap
            release/*.yml
            !release/builder-debug.yml
          if-no-files-found: error

  build-android:
    name: Build Android APK
    needs: check
    if: needs.check.outputs.skip != 'true' && inputs.skip_android != true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_VARIANT: production
      # Never pull upstream pingdotgg Expo OTA updates over the Swarmcode fork bundle.
      T3CODE_MOBILE_UPDATES_ENABLED: "0"
      ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Checkout agy
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.check.outputs.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/mobile... --filter=@t3tools/scripts...

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ hashFiles('apps/mobile/package.json', 'apps/mobile/app.config.ts', 'pnpm-lock.yaml') }}
          restore-keys: |
            gradle-android-

      - name: Load T3 Connect public config
        run: |
          relay="$(sed -n "s|^T3CODE_RELAY_URL=||p" .env.example)"
          clerk_key="$(sed -n "s|^T3CODE_CLERK_PUBLISHABLE_KEY=||p" .env.example)"
          clerk_jwt="$(sed -n "s|^T3CODE_CLERK_JWT_TEMPLATE=||p" .env.example)"
          [[ -n "$relay" ]] && echo "T3CODE_RELAY_URL=$relay" >> "$GITHUB_ENV"
          [[ -n "$clerk_key" ]] && echo "EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY=$clerk_key" >> "$GITHUB_ENV"
          [[ -n "$clerk_jwt" ]] && echo "EXPO_PUBLIC_CLERK_JWT_TEMPLATE=$clerk_jwt" >> "$GITHUB_ENV"

      - id: release_meta
        name: Resolve version
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RELEASE_DATE: ${{ needs.check.outputs.date }}
        run: |
          node scripts/resolve-nightly-release.ts \
            --date "$RELEASE_DATE" \
            --run-number "$((100000 + RUN_NUMBER))" \
            --sha "$(git rev-parse HEAD)" \
            --github-output
          echo "T3CODE_ANDROID_VERSION_CODE=$((100000 + RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Rebrand as Swarmcode
        run: node scripts/agy/apply-brand.ts

      - name: Expo prebuild Android
        working-directory: apps/mobile
        env:
          EXPO_NO_GIT_STATUS: "1"
          T3CODE_MOBILE_VERSION: ${{ steps.release_meta.outputs.version }}
        run: |
          mkdir -p ~/.gradle
          printf 'org.gradle.caching=true\norg.gradle.daemon=false\n' > ~/.gradle/gradle.properties
          vp exec expo prebuild --clean --platform android --no-install

      - name: Build Android release APK
        working-directory: apps/mobile/android
        env:
          T3CODE_MOBILE_VERSION: ${{ steps.release_meta.outputs.version }}
        run: |
          ./gradlew :app:assembleRelease -x lintVitalAnalyzeRelease -x lintVitalRelease --no-daemon

      - name: Stage APK artifact
        env:
          VERSION: ${{ steps.release_meta.outputs.version }}
        run: |
          mkdir -p release
          apk="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          [[ -f "$apk" ]] || { echo "::error::Expected APK not found at $apk"; exit 1; }
          cp "$apk" "release/Swarmcode-${VERSION}-android-arm64.apk"
          ls -lh release/

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release
          path: release/*.apk
          if-no-files-found: error

  publish:
    name: Publish prerelease
    needs: [check, build-windows, build-android]
    if: always() && needs.check.outputs.skip != 'true' && needs.build-windows.result == 'success' && (needs.build-android.result == 'success' || needs.build-android.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release
          path: release

      - name: Download Android APK
        if: needs.build-android.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-release
          path: release

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build-windows.outputs.tag }}
          VERSION: ${{ needs.build-windows.outputs.version }}
          AGY_SHA: ${{ needs.check.outputs.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          {
            echo 'Swarmcode is an unofficial fork of T3 Code. It is not affiliated with, endorsed by, or maintained by T3 Tools, Inc.'
            echo
            echo '- **Windows**: Unsigned NSIS installer (`Swarmcode-*-x64.exe`). Windows SmartScreen will warn on first install. Installed copies update themselves from these releases.'
            echo '- **Android**: Standalone arm64 APK (`Swarmcode-*-android-arm64.apk`), package `io.github.daniloskyrim.swarmcode` (installs side-by-side with official T3 Code).'
            echo
            echo "agy-commit: $AGY_SHA"
          } > "$RUNNER_TEMP/notes.md"
          assets=(release/*.exe release/*.blockmap release/*.apk)
          for feed in release/*.yml; do
            [[ "$feed" == */builder-debug.yml ]] || assets+=("$feed")
          done
          gh release create "$TAG" "${assets[@]}" \
            --target "$AGY_SHA" \
            --prerelease \
            --title "Swarmcode Nightly $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"
